apiVersion: 1
datasources:
  - name: Payment Rollups
    type: yesoreyeram-infinity-datasource
    uid: payment-rollups
    access: proxy
    url: $PAYMENT_METRICS_ORIGIN
    jsonData:
      auth_method: bearerToken
      allowedHosts:
        - $PAYMENT_METRICS_ORIGIN
    secureJsonData:
      bearerToken: $PAYMENT_METRICS_TOKEN
