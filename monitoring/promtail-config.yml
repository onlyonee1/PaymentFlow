server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Tail Docker container logs from /var/lib/docker/containers.
  # Each container's stdout/stderr is scraped and labelled with
  # container_name, compose_service, and log_level (extracted from
  # the structured JSON the backend emits).
  - job_name: docker_containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        regex: '/?(.*)'
        target_label: container_name
      - source_labels: [__meta_docker_compose_service]
        target_label: service
      - source_labels: [__meta_docker_container_label_com_docker_compose_project]
        target_label: project
    pipeline_stages:
      # Parse the structured JSON that pino / our winston logger emits.
      - json:
          expressions:
            level: level
            correlationId: correlationId
            schoolId: schoolId
            message: message
      - labels:
          level:
          service:
      # Drop noisy debug lines in production unless LOG_LEVEL=debug is set.
      - drop:
          source: level
          expression: "^debug$"
          drop_counter_reason: debug_suppressed

  # Tail /var/log/syslog for host-level events.
  - job_name: syslog
    static_configs:
      - targets:
          - localhost
        labels:
          job: syslog
          __path__: /var/log/syslog
