version: "3.8"

# Local development monitoring stack for metrics and traces.
#
# Usage:
#   1. Set METRICS_TOKEN in backend/.env (generate with: openssl rand -hex 32)
#   2. Copy that token into monitoring/prometheus.yml under authorization.credentials
#   3. Set GRAFANA_PASSWORD to a strong password (required — no default):
#        export GRAFANA_PASSWORD=$(openssl rand -hex 24)
#   4. docker compose -f docker-compose.monitoring.yml up -d
#
# Prometheus: http://localhost:9090
# Grafana:    http://localhost:3001  (admin / <GRAFANA_PASSWORD>)
# Jaeger:     http://localhost:16686
# OTLP/HTTP:  http://localhost:4318
#
# NOTE: GRAFANA_PASSWORD is a required environment variable. Docker Compose will
# refuse to start the monitoring stack if it is not set.

services:
  prometheus:
    image: prom/prometheus:v2.51.2
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts:/etc/prometheus/alerts:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    # Allows the container to reach the backend running on the Docker host.
    # On Linux, host-gateway resolves to the host machine's IP so that
    # host.docker.internal works the same as on Mac/Windows Docker Desktop.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:10.4.3
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_PASSWORD:?Set GRAFANA_PASSWORD before starting the monitoring stack}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: "yesoreyeram-infinity-datasource 2.4.0"
      PAYMENT_METRICS_ORIGIN: ${PAYMENT_METRICS_ORIGIN:-http://host.docker.internal:5000}
      PAYMENT_METRICS_TOKEN: ${METRICS_BEARER_TOKEN:-${METRICS_TOKEN:-}}
      GF_SERVER_ROOT_URL: "http://localhost:3001"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - prometheus
      - loki
    networks:
      - monitoring

  jaeger:
    image: jaegertracing/all-in-one:1.67.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:16686:16686"
    networks:
      - monitoring

  tempo:
    image: grafana/tempo:2.7.2
    command: ["-config.file=/etc/tempo.yml"]
    volumes:
      - ./monitoring/tempo.yml:/etc/tempo.yml:ro
      - tempo_data:/var/tempo
    networks:
      - monitoring

  otel-collector:
    image: otel/opentelemetry-collector:0.119.0
    command: ["--config=/etc/otel-collector.yml"]
    volumes:
      - ./monitoring/otel-collector.yml:/etc/otel-collector.yml:ro
    ports:
      - "127.0.0.1:4318:4318"
    depends_on:
      - jaeger
      - tempo
    networks:
      - monitoring

  # ── Infrastructure exporters ──────────────────────────────────────────────

  # Exports MongoDB metrics (connection pool, op counters, replication lag, etc.)
  # Uses the percona/mongodb_exporter image which supports MongoDB 5+/6+/7+.
  # Set MONGO_URI in your environment or .env file so the exporter can connect.
  mongodb_exporter:
    image: percona/mongodb_exporter:0.40
    command:
      - "--mongodb.uri=${MONGO_URI:-mongodb://root:password@host.docker.internal:27017/?authSource=admin&replicaSet=rs0}"
      - "--collect-all"
      - "--compatible-mode"
    ports:
      - "9216:9216"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - monitoring
    restart: unless-stopped

  # Exports Redis metrics (memory usage, connected clients, hit/miss ratios, etc.)
  redis_exporter:
    image: oliver006/redis_exporter:v1.59.0
    environment:
      REDIS_ADDR: "redis://host.docker.internal:6379"
      # Set REDIS_PASSWORD here if your Redis instance requires auth.
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
    ports:
      - "9121:9121"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - monitoring
    restart: unless-stopped

  # Exports host/container-level metrics (CPU, memory, disk, network I/O).
  # Requires access to host proc/sys filesystems — run in read-only mode.
  node_exporter:
    image: prom/node-exporter:v1.7.0
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    ports:
      - "9100:9100"
    networks:
      - monitoring
    restart: unless-stopped

networks:
  monitoring:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:
  tempo_data:
